[package]
name = "mcp-cli"
version = "0.3.0"
edition = "2024"
publish = false

[features]
default = []
test-fixtures = []

[lib]
name = "mcp_cli"
path = "src/lib.rs"

[[bin]]
name = "mcp-cli"
path = "src/main.rs"

[[bin]]
name = "mock-stdio-server"
path = "src/bin/mock_stdio_server.rs"
required-features = ["test-fixtures"]

